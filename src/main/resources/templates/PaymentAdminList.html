<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link active" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container my-4">
    <h3>All Payments</h3>
    <p class="text-muted">Admin view across the full product-order-payment flow.</p>

    <table id="paymentTable" border="1" class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th scope="col">Payment ID</th>
            <th scope="col">Method</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="payment : ${payments}">
            <td th:text="${payment.id}"></td>
            <td th:text="${payment.method}"></td>
            <td th:text="${payment.status}"></td>
            <td>
                <a th:id="'view-admin-detail-btn-' + ${payment.id}"
                   th:href="@{/payment/admin/detail/{paymentId}(paymentId=${payment.id})}"
                   class="btn btn-primary btn-sm">
                    View Detail
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="alert alert-info" th:if="${payments == null or #lists.isEmpty(payments)}">
        No payments available.
    </div>

    <div class="mt-3">
        <a th:href="@{/product/list}" class="btn btn-outline-secondary btn-sm mr-1">Back to Products</a>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm mr-1">Back to Orders</a>
        <a th:href="@{/payment/detail}" class="btn btn-outline-secondary btn-sm">Payment Detail</a>
    </div>
</div>
</body>
</html>
