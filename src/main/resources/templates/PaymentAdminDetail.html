<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link active" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container my-4">
    <h3>Payment Admin Detail</h3>

    <div class="card p-3 col-8" th:if="${payment != null}">
        <div><strong>Payment ID:</strong> <span id="paymentIdText" th:text="${payment.id}"></span></div>
        <div class="mt-1"><strong>Method:</strong> <span id="paymentMethodText" th:text="${payment.method}"></span></div>
        <div class="mt-1"><strong>Status:</strong> <span id="paymentStatusText" th:text="${payment.status}"></span></div>
        <div class="mt-2">
            <strong>Payment Data:</strong>
            <ul class="mb-0">
                <li th:each="entry : ${payment.paymentData}" th:text="${entry.key + ': ' + entry.value}"></li>
            </ul>
        </div>

        <div class="mt-3 d-flex">
            <form th:action="@{/payment/admin/set-status/{paymentId}(paymentId=${payment.id})}" method="post" class="mr-2">
                <input type="hidden" name="status" value="SUCCESS">
                <button id="acceptPaymentButton" type="submit" class="btn btn-success">Accept</button>
            </form>
            <form th:action="@{/payment/admin/set-status/{paymentId}(paymentId=${payment.id})}" method="post">
                <input type="hidden" name="status" value="REJECTED">
                <button id="rejectPaymentButton" type="submit" class="btn btn-danger">Reject</button>
            </form>
        </div>
    </div>

    <div class="alert alert-warning col-8" th:if="${payment == null}">
        Payment not found.
    </div>

    <div class="mt-3">
        <a th:href="@{/payment/admin/list}" class="btn btn-outline-secondary btn-sm mr-1">Back to Admin List</a>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm mr-1">Back to Orders</a>
        <a th:href="@{/product/list}" class="btn btn-outline-secondary btn-sm">Back to Products</a>
    </div>
</div>
</body>
</html>
