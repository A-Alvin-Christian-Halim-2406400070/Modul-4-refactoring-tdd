<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERd`knLPMO" crossorigin="anonymous">
    <style>.error-text { color: #b00020; }</style>
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container">
    <h3>Edit Product</h3>

    <form th:action="@{/product/edit}" th:object="${product}" method="post">
        <input type="hidden" name="productId" th:value="${product.productId}" />
        <div class="form-group">
            <label for="nameInput">Name</label>
            <input name="productName" th:value="${product.productName}" type="text" class="form-control mb-4 col-4" id="nameInput">
        </div>
        <div class="form-group">
            <label for="quantityInput">Quantity</label>
            <input name="productQuantity" th:value="${productQuantityRaw} ?: ${product.productQuantity}" type="text" class="form-control mb-4 col-4" id="quantityInput">
            <div th:if="${errors != null and errors.containsKey('productQuantity')}" class="error-text" id="quantityError" th:text="${errors.get('productQuantity')}"></div>
        </div>
        <button type="submit" id="submitButton" class="btn btn-primary">Save</button>
        <a th:href="@{/product/list}" class="btn btn-link">Back to Product List</a>
    </form>

    <div class="mt-3">
        <a th:href="@{/order/create}" class="btn btn-outline-secondary btn-sm mr-1">Create Order</a>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm mr-1">Order History</a>
        <a th:href="@{/payment/detail}" class="btn btn-outline-secondary btn-sm">Open Payments</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
