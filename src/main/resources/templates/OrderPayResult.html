<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Result</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link active" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container my-4">
    <h3>Payment Created</h3>
    <p>Your payment has been submitted.</p>

    <div class="card p-3 col-6">
        <div>
            <strong>Payment ID:</strong>
            <span id="paymentIdText" th:text="${payment != null ? payment.id : paymentId}"></span>
        </div>
        <div class="mt-2" th:if="${payment != null}">
            <strong>Status:</strong>
            <span th:text="${payment.status}"></span>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/payment/detail/{paymentId}(paymentId=${payment != null ? payment.id : paymentId})}" class="btn btn-primary btn-sm mr-1">View Payment Detail</a>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm mr-1">Back to Orders</a>
        <a th:href="@{/product/list}" class="btn btn-outline-secondary btn-sm">Back to Products</a>
    </div>
</div>
</body>
</html>
