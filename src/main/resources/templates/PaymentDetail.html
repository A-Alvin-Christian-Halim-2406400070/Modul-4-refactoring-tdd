<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link active" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container my-4">
    <h3>Payment Detail</h3>
    <p class="text-muted">Check payment status after completing the product and order steps.</p>

    <form id="paymentDetailForm" method="get" onsubmit="event.preventDefault(); const id = document.getElementById('paymentIdInput').value; if (id) { window.location.href = '/payment/detail/' + id; }">
        <div class="form-group">
            <label for="paymentIdInput">Payment ID</label>
            <input id="paymentIdInput" name="paymentId" type="text" class="form-control mb-3 col-6" placeholder="Enter payment ID" required>
        </div>
        <button id="findPaymentButton" type="submit" class="btn btn-primary">Find Payment</button>
    </form>

    <div class="mt-4" th:if="${payment != null}">
        <div class="card p-3 col-8">
            <div><strong>Payment ID:</strong> <span id="paymentIdText" th:text="${payment.id}"></span></div>
            <div class="mt-1"><strong>Method:</strong> <span id="paymentMethodText" th:text="${payment.method}"></span></div>
            <div class="mt-1"><strong>Status:</strong> <span id="paymentStatusText" th:text="${payment.status}"></span></div>
            <div class="mt-2">
                <strong>Payment Data:</strong>
                <ul class="mb-0">
                    <li th:each="entry : ${payment.paymentData}" th:text="${entry.key + ': ' + entry.value}"></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="mt-4 alert alert-info col-8" th:if="${payment == null and paymentId != null}">
        Payment not found for ID: <span th:text="${paymentId}"></span>
    </div>

    <div class="mt-3">
        <a th:href="@{/product/list}" class="btn btn-outline-secondary btn-sm mr-1">Back to Products</a>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm mr-1">Back to Orders</a>
        <a th:href="@{/payment/admin/list}" class="btn btn-outline-secondary btn-sm">Payment Admin</a>
    </div>
</div>
</body>
</html>
