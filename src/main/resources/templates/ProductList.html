<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link active" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container my-2">
    <h2>Product List</h2>
    <div class="mb-3">
        <a id="createProductButton" th:href="@{/product/create}" class="btn btn-primary btn-sm mr-1">Create Product</a>
        <a th:href="@{/order/create}" class="btn btn-outline-secondary btn-sm mr-1">Create Order</a>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm mr-1">Order History</a>
        <a th:href="@{/payment/detail}" class="btn btn-outline-secondary btn-sm">Go to Payments</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <table border="1" class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th scope="col">Product Name</th>
            <th scope="col">Quantity</th>
            <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product: ${products}">
            <td th:text="${product.productName}"></td>
            <td th:text="${product.productQuantity}"></td>
            <td>
                <a th:href="@{/product/edit/{productId}(productId=${product.productId})}" th:id="'edit-btn-' + ${product.productId}" class="btn btn-secondary btn-sm mr-1">Edit</a>
                <form th:action="@{/product/delete}" method="post" style="display:inline;" onsubmit="return confirm('Delete this product?');">
                    <input type="hidden" name="productId" th:value="${product.productId}" />
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
