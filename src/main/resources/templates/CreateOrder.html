<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link active" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container my-4">
    <h3>Create Order</h3>
    <p class="text-muted">Order step sits between product management and payment processing.</p>
    <form th:action="@{/order/create}" method="post">
        <div class="form-group">
            <label for="authorInput">Author Name</label>
            <input id="authorInput" name="author" type="text" class="form-control mb-3 col-5" placeholder="Enter your name" required>
        </div>
        <button id="createOrderButton" type="submit" class="btn btn-primary">Create Order</button>
        <a th:href="@{/order/history}" class="btn btn-link">Open Order History</a>
    </form>

    <div class="mt-3">
        <a th:href="@{/product/list}" class="btn btn-outline-secondary btn-sm mr-1">Back to Products</a>
        <a th:href="@{/payment/detail}" class="btn btn-outline-secondary btn-sm">Continue to Payments</a>
    </div>
</div>
</body>
</html>
