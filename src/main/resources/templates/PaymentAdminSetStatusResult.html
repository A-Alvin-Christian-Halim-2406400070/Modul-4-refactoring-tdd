<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Status Updated</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link active" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container my-4">
    <h3>Payment Status Updated</h3>

    <div class="card p-3 col-8" th:if="${payment != null}">
        <div><strong>Payment ID:</strong> <span id="paymentIdText" th:text="${payment.id}"></span></div>
        <div class="mt-1"><strong>Updated Status:</strong> <span id="updatedStatusText" th:text="${payment.status}"></span></div>
    </div>

    <div class="alert alert-warning col-8" th:if="${payment == null}">
        Payment status update result is not available.
    </div>

    <div class="mt-3">
        <a th:if="${payment != null}" th:href="@{/payment/admin/detail/{paymentId}(paymentId=${payment.id})}" class="btn btn-primary btn-sm mr-1">Back to Payment Detail</a>
        <a th:href="@{/payment/admin/list}" class="btn btn-outline-secondary btn-sm mr-1">Back to Admin List</a>
        <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm">Back to Orders</a>
    </div>
</div>
</body>
</html>
