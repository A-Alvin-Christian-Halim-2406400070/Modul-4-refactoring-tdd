<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Status Updated</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <h3>Payment Status Updated</h3>

    <div class="card p-3 col-8" th:if="${payment != null}">
        <div><strong>Payment ID:</strong> <span id="paymentIdText" th:text="${payment.id}"></span></div>
        <div class="mt-1"><strong>Updated Status:</strong> <span id="updatedStatusText" th:text="${payment.status}"></span></div>
    </div>

    <div class="alert alert-warning col-8" th:if="${payment == null}">
        Payment status update result is not available.
    </div>
</div>
</body>
</html>
