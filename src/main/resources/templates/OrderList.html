<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/product/list}">Products</a>
        <a class="nav-item nav-link active" th:href="@{/order/history}">Orders</a>
        <a class="nav-item nav-link" th:href="@{/payment/detail}">Payments</a>
        <a class="nav-item nav-link" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
</nav>

<div class="container my-4">
    <h3>Orders</h3>
    <p class="text-muted">Select an order to continue to payment creation.</p>
    <table border="1" class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th scope="col">Order ID</th>
            <th scope="col">Author</th>
            <th scope="col">Order Time</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.author}"></td>
            <td th:text="${order.orderTime}"></td>
            <td th:text="${order.status}"></td>
            <td>
                <a th:href="|/order/pay/${order.id}|" class="btn btn-primary btn-sm">Pay</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${orders == null or #lists.isEmpty(orders)}" class="alert alert-info" role="alert">
        No orders found.
    </div>

    <div class="mt-3">
        <a th:href="@{/product/list}" class="btn btn-outline-secondary btn-sm mr-1">Back to Products</a>
        <a th:href="@{/payment/detail}" class="btn btn-outline-secondary btn-sm">Open Payment Detail</a>
    </div>
</div>
</body>
</html>
